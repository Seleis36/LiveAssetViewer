---
# Full provisioning — run once after Terraform creates the instances
- name: Common setup (all instances)
  hosts: all
  roles:
    - common

- name: Deploy kdb+
  hosts: role_kdb
  roles:
    - kdb

- name: Deploy app (frontend + backend)
  hosts: role_app
  roles:
    - app

- name: Bootstrap GitLab CI runner
  hosts: role_runner
  roles:
    - runner
