name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1

jobs:

  # ---- LINT -------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Lint frontend
        run: cd frontend && npm ci && npm run lint

      - name: Lint backend
        run: cd backend && npm ci && npm run lint

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.0

      - name: Validate Terraform
        run: cd infra && tofu init -backend=false && tofu validate

  # ---- TEST -------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Test frontend
        run: cd frontend && npm ci && npm run test -- --coverage

      - name: Test backend
        run: cd backend && npm ci && npm run test -- --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            frontend/coverage/lcov.info
            backend/coverage/lcov.info

  # ---- SONARQUBE --------------------------------------------
  sonarqube:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ vars.SONAR_ENABLED == 'true' || (secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: SonarQube scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube quality gate
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ---- BUILD & DEPLOY (disabled — no OIDC provider available) ----
  # AWS deployment is performed manually using local credentials:
  #   1. cd infra && tofu apply
  #   2. ansible-playbook ansible/playbooks/site.yml   (first time)
  #      ansible-playbook ansible/playbooks/deploy.yml -e image_tag=<sha>  (updates)
  # Docker images are built and pushed to ECR locally:
  #   aws ecr get-login-password | docker login ...
  #   docker build -t <ecr_url>/price-viewer/frontend:<sha> ./frontend && docker push ...
  #
  # To re-enable once an OIDC Identity Provider is available:
  #   - Create IAM OIDC provider for https://token.actions.githubusercontent.com
  #   - Create github-actions-role with trust policy scoped to this repo
  #   - Uncomment the build and deploy jobs below
  #   - Add AWS_OIDC_ROLE_ARN and AWS_ACCOUNT_ID as GitHub Actions secrets
